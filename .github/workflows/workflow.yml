name: "Workflow"
on:
  push: {}
jobs:
  verify:
    name: "Verify"
    runs-on: ubuntu-latest
    steps:
      - name: "pull"
        uses: actions/checkout@v3

      - name: "exec"
        run: |
          chmod +x prepare
          ./prepare
        env:
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}

